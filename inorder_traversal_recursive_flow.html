
<style>
  .btn { cursor: pointer; padding: 6px 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 13px; }
  .btn:hover { background: var(--color-background-secondary); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--color-background-info); color: var(--color-text-info); border-color: transparent; }
</style>

<div style="padding: 1rem 0 0; font-family: var(--font-sans);">

  <!-- Tree SVG -->
  <svg id="treeSvg" width="100%" viewBox="0 0 680 240">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <!-- Edges -->
    <line x1="340" y1="58" x2="210" y2="138" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <line x1="340" y1="58" x2="470" y2="138" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <line x1="210" y1="138" x2="145" y2="210" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <line x1="210" y1="138" x2="275" y2="210" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <line x1="470" y1="138" x2="405" y2="210" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <line x1="470" y1="138" x2="535" y2="210" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <!-- Nodes: id, cx, cy, value -->
    <!-- Root=4, Left=2, Right=6, LL=1, LR=3, RL=5, RR=7 -->
    <g id="node-4"><circle cx="340" cy="38" r="26" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/><text x="340" y="43" text-anchor="middle" font-size="16" font-weight="500" fill="var(--color-text-primary)">4</text></g>
    <g id="node-2"><circle cx="210" cy="118" r="26" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/><text x="210" y="123" text-anchor="middle" font-size="16" font-weight="500" fill="var(--color-text-primary)">2</text></g>
    <g id="node-6"><circle cx="470" cy="118" r="26" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/><text x="470" y="123" text-anchor="middle" font-size="16" font-weight="500" fill="var(--color-text-primary)">6</text></g>
    <g id="node-1"><circle cx="145" cy="192" r="26" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/><text x="145" y="197" text-anchor="middle" font-size="16" font-weight="500" fill="var(--color-text-primary)">1</text></g>
    <g id="node-3"><circle cx="275" cy="192" r="26" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/><text x="275" y="197" text-anchor="middle" font-size="16" font-weight="500" fill="var(--color-text-primary)">3</text></g>
    <g id="node-5"><circle cx="405" cy="192" r="26" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/><text x="405" y="197" text-anchor="middle" font-size="16" font-weight="500" fill="var(--color-text-primary)">5</text></g>
    <g id="node-7"><circle cx="535" cy="192" r="26" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/><text x="535" y="197" text-anchor="middle" font-size="16" font-weight="500" fill="var(--color-text-primary)">7</text></g>
  </svg>

  <!-- Call stack + code panel -->
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:8px 0;">
    <!-- Call stack -->
    <div style="border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:12px;">
      <div style="font-size:12px; color:var(--color-text-secondary); margin-bottom:8px;">call stack</div>
      <div id="callStack" style="display:flex; flex-direction:column-reverse; gap:4px; min-height:80px;"></div>
    </div>
    <!-- Code highlight -->
    <div style="border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:12px; font-family:var(--font-mono); font-size:12px; line-height:1.7;">
      <div id="code-line1" style="padding:1px 4px; border-radius:3px;">void inOrder(Node root) {</div>
      <div id="code-line2" style="padding:1px 4px; border-radius:3px;">  if (root != null) {</div>
      <div id="code-line3" style="padding:1px 4px; border-radius:3px;">    inOrder(root.left);</div>
      <div id="code-line4" style="padding:1px 4px; border-radius:3px;">    print(root.data);</div>
      <div id="code-line5" style="padding:1px 4px; border-radius:3px;">    inOrder(root.right);</div>
      <div id="code-line6" style="padding:1px 4px; border-radius:3px;">  } // null → return</div>
      <div style="padding:1px 4px;">}</div>
    </div>
  </div>

  <div style="border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px;">
    <span style="font-size:12px; color:var(--color-text-secondary);">input: 1 2 3 4 5 6 7</span>
    <span id="input" style="font-family:var(--font-mono); font-size:14px; font-weight:500; color:var(--color-text-primary); letter-spacing:2px;"></span>
  </div>
  <!-- Output bar -->
  <div style="border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px;">
    <span style="font-size:12px; color:var(--color-text-secondary);">output:</span>
    <span id="output" style="font-family:var(--font-mono); font-size:14px; font-weight:500; color:var(--color-text-primary); letter-spacing:2px;"></span>
  </div>

  <!-- Explanation -->
  <div id="explanation" style="font-size:13px; color:var(--color-text-secondary); min-height:36px; margin-bottom:12px; line-height:1.5;"></div>

  <!-- Controls -->
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <button class="btn primary" id="btnNext" onclick="step()">Next step ▶</button>
    <button class="btn" onclick="reset()">Reset</button>
  </div>
</div>

<script>
const AMBER50='#FAEEDA', AMBER200='#EF9F27', AMBER800='#633806';
const TEAL50='#E1F5EE', TEAL600='#0F6E56', TEAL800='#085041';
const GRAY100='var(--color-background-secondary)';

// Tree structure: node -> {val, leftId, rightId, cx, cy}
const nodes = {
  4: {val:4, left:2, right:6, cx:340, cy:38},
  2: {val:2, left:1, right:3, cx:210, cy:118},
  6: {val:6, left:5, right:7, cx:470, cy:118},
  1: {val:1, left:null, right:null, cx:145, cy:192},
  3: {val:3, left:null, right:null, cx:275, cy:192},
  5: {val:5, left:null, right:null, cx:405, cy:192},
  7: {val:7, left:null, right:null, cx:535, cy:192},
};

// Pre-compute steps: {type, nodeId, line, explanation, callStack, output, highlight}
const steps = [];
let outputSoFar = '';

function buildSteps(nid, depth) {
  if (nid === null) {
    steps.push({type:'null', nodeId:null, line:6,
      explanation:`inOrder(null) → base case, root is null → return immediately`,
      callStack: [...callFrames], output: outputSoFar});
    return;
  }
  const n = nodes[nid];
  callFrames.push(`inOrder(${nid})`);
  steps.push({type:'enter', nodeId:nid, line:2,
    explanation:`inOrder(${nid}) called → root=${nid} is not null, continue`,
    callStack:[...callFrames], output:outputSoFar});
  // go left
  steps.push({type:'goLeft', nodeId:nid, line:3,
    explanation:`Call inOrder(root.left) → inOrder(${n.left ?? 'null'})`,
    callStack:[...callFrames], output:outputSoFar});
  buildSteps(n.left, depth+1);
  // print
  outputSoFar += outputSoFar ? ' '+nid : ''+nid;
  steps.push({type:'print', nodeId:nid, line:4,
    explanation:`print(root.data) → prints ${nid}`,
    callStack:[...callFrames], output:outputSoFar});
  // go right
  steps.push({type:'goRight', nodeId:nid, line:5,
    explanation:`Call inOrder(root.right) → inOrder(${n.right ?? 'null'})`,
    callStack:[...callFrames], output:outputSoFar});
  buildSteps(n.right, depth+1);
  callFrames.pop();
  steps.push({type:'return', nodeId:nid, line:6,
    explanation:`inOrder(${nid}) done → return to caller`,
    callStack:[...callFrames], output:outputSoFar});
}

let callFrames = [];
buildSteps(4, 0);
steps.push({type:'done', nodeId:null, line:null,
  explanation:'Traversal complete! In-order gives sorted output: 1 2 3 4 5 6 7',
  callStack:[], output:outputSoFar});

let currentStep = -1;
let activeNode = null;

function highlightLine(lineNum) {
  for(let i=1;i<=6;i++){
    const el = document.getElementById('code-line'+i);
    el.style.background = i === lineNum ? AMBER50 : '';
    el.style.color = i === lineNum ? AMBER800 : '';
    el.style.fontWeight = i === lineNum ? '500' : '';
  }
}

function highlightNode(nid, type) {
  // reset all
  Object.keys(nodes).forEach(id => {
    const g = document.getElementById('node-'+id);
    const circle = g.querySelector('circle');
    circle.style.fill = 'var(--color-background-secondary)';
    circle.style.stroke = 'var(--color-border-secondary)';
    circle.style.strokeWidth = '1';
  });
  if (nid && nodes[nid]) {
    const g = document.getElementById('node-'+nid);
    const circle = g.querySelector('circle');
    if(type==='print') { circle.style.fill=TEAL50; circle.style.stroke=TEAL600; circle.style.strokeWidth='2.5'; }
    else { circle.style.fill=AMBER50; circle.style.stroke=AMBER200; circle.style.strokeWidth='2.5'; }
  }
}

function renderCallStack(frames) {
  const el = document.getElementById('callStack');
  el.innerHTML = frames.map((f,i) => `<div style="font-size:12px;font-family:var(--font-mono);padding:3px 8px;border-radius:4px;background:${i===frames.length-1?AMBER50:'var(--color-background-secondary)'};color:${i===frames.length-1?AMBER800:'var(--color-text-secondary)'};border:0.5px solid ${i===frames.length-1?AMBER200:'var(--color-border-tertiary)'}">${f}</div>`).join('');
}

function step() {
  currentStep++;
  if(currentStep >= steps.length) { currentStep = steps.length-1; return; }
  const s = steps[currentStep];
  highlightLine(s.line);
  highlightNode(s.nodeId, s.type);
  renderCallStack(s.callStack);
  document.getElementById('output').textContent = s.output ? s.output : '';
  document.getElementById('explanation').textContent = s.explanation;

  if(s.type==='done') {
    document.getElementById('btnNext').disabled = true;
    document.getElementById('explanation').style.color = 'var(--color-text-success, #0F6E56)';
    document.getElementById('explanation').style.fontWeight = '500';
  }
}

function reset() {
  currentStep = -1;
  highlightLine(null);
  Object.keys(nodes).forEach(id => {
    const g = document.getElementById('node-'+id);
    const circle = g.querySelector('circle');
    circle.style.fill='var(--color-background-secondary)';
    circle.style.stroke='var(--color-border-secondary)';
    circle.style.strokeWidth='1';
  });
  for(let i=1;i<=6;i++) {
    const el = document.getElementById('code-line'+i);
    el.style.background=''; el.style.color=''; el.style.fontWeight='';
  }
  document.getElementById('callStack').innerHTML='';
  document.getElementById('output').textContent='';
  document.getElementById('explanation').textContent='Press "Next step" to start the traversal.';
  document.getElementById('explanation').style.color='';
  document.getElementById('explanation').style.fontWeight='';
  document.getElementById('btnNext').disabled=false;
}

reset();
</script>
